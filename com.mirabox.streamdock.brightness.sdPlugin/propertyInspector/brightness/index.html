<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Яркость</title>
  <style>
    html, body {
      margin: 0;
      background: #2d2d2d;
      color: #d8d8d8;
      font: 13px/1.45 "Segoe UI", sans-serif;
    }
    .wrap { padding: 14px 16px 18px; }
    h1 { margin: 0 0 8px; font-size: 15px; font-weight: 650; }
    p { margin: 0 0 8px; color: #bdbdbd; }
    label {
      display: block;
      margin: 12px 0 4px;
      color: #d8d8d8;
    }
    select {
      width: 100%;
      height: 32px;
      padding: 0 8px;
      border: 1px solid #555;
      border-radius: 4px;
      background: #3d3d3d;
      color: #f4f7fb;
    }
    strong { color: #f4f7fb; font-weight: 650; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Яркость</h1>
    <p>Поворот крутилки меняет яркость выбранного экрана. Сейчас на нём <strong id="brightness">—</strong>.</p>
    <label for="monitor">Монитор</label>
    <select id="monitor"></select>
    <label for="step">Шаг</label>
    <select id="step">
      <option value="1">1%</option>
      <option value="5" selected>5%</option>
      <option value="10">10%</option>
    </select>
    <p>Только для крутилки. Нажатие переключает экран по кругу, последним идёт «Все». Поворот тогда меняет яркость сразу на всех. У монитора с пометкой HDR крутится яркость Windows.</p>
  </div>
  <script src="index.js"></script>
</body>
</html>
