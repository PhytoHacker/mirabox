<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Happ</title>
  <style>
    html, body {
      margin: 0;
      background: #2d2d2d;
      color: #d8d8d8;
      font: 13px/1.45 "Segoe UI", sans-serif;
    }
    .wrap { padding: 14px 16px 18px; }
    h1 { margin: 0 0 8px; font-size: 15px; font-weight: 650; }
    p { margin: 0 0 8px; color: #bdbdbd; }
    code {
      font-family: Consolas, monospace;
      color: #f4f7fb;
    }
    label {
      display: block;
      margin: 12px 0 4px;
      color: #d8d8d8;
    }
    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 0 8px;
    }
    input[type="color"] {
      width: 100%;
      height: 32px;
      padding: 0;
      border: 1px solid #555;
      background: #3d3d3d;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="title">Happ</h1>
    <p id="text"></p>
    <p>Команда: <code id="command"></code></p>
    <div id="tune" hidden>
      <label class="check" for="showCaption">
        <input id="showCaption" type="checkbox" checked>
        Подпись «ВКЛ» / «ВЫКЛ» под знаком
      </label>
      <label for="colorOn">Цвет вкл</label>
      <input id="colorOn" type="color" value="#ffffff">
      <label for="colorOff">Цвет выкл</label>
      <input id="colorOff" type="color" value="#4e4e4e">
      <p>Подпись стоит под знаком Happ и меняется вместе с состоянием.</p>
    </div>
    <p id="note">Happ берёт сервер, который уже выбран в списке. Если приложение закрыто, команда его запустит.</p>
  </div>
  <script src="index.js"></script>
</body>
</html>
